name: Deploy web and API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ vars.DEPLOY_HOST != '' && vars.DEPLOY_USER != '' && vars.DEPLOY_PATH != '' && vars.APP_IMAGE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload deployment definition
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          TARGET: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" "mkdir -p '$TARGET/deploy'"
          scp compose.yaml "$USER@$HOST:$TARGET/compose.yaml"
          scp deploy/Caddyfile "$USER@$HOST:$TARGET/deploy/Caddyfile"
      - name: Roll out container
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          TARGET: ${{ vars.DEPLOY_PATH }}
          APP_IMAGE: ${{ vars.APP_IMAGE }}
        run: |
          ssh "$USER@$HOST" "cd '$TARGET' && if [ -n \"\$(APP_IMAGE='$APP_IMAGE' docker compose --env-file deploy/.env ps -q app)\" ]; then APP_IMAGE='$APP_IMAGE' docker compose --env-file deploy/.env exec -T app node server/backup.mjs; fi && APP_IMAGE='$APP_IMAGE' docker compose --env-file deploy/.env pull app && APP_IMAGE='$APP_IMAGE' docker compose --env-file deploy/.env up -d --remove-orphans && APP_IMAGE='$APP_IMAGE' docker compose --env-file deploy/.env exec -T app node -e \"fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
