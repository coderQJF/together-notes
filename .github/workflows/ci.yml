name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build:h5
        env:
          CI: 1
      - run: npm run build:mp-weixin
        env:
          CI: 1
      - run: npm run build:app
        env:
          CI: 1
      - uses: actions/upload-artifact@v4
        with:
          name: h5
          path: dist/build/h5
      - uses: actions/upload-artifact@v4
        with:
          name: mp-weixin
          path: dist/build/mp-weixin
      - uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: dist/build/app
