services:
  app:
    image: ${APP_IMAGE:-together-notes:latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/app.sqlite
      BACKUP_DIR: /data/backups
      KEEP_BACKUPS: ${KEEP_BACKUPS:-14}
      PUBLIC_DIR: /app/public
      MEDIA_DIR: /data/media
      MEDIA_MAX_TOTAL_BYTES: ${MEDIA_MAX_TOTAL_BYTES:-536870912}
      MEDIA_MAX_FILES: ${MEDIA_MAX_FILES:-5000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WX_APP_ID: ${WX_APP_ID:?请配置 WX_APP_ID}
      WX_APP_SECRET: ${WX_APP_SECRET:?请配置 WX_APP_SECRET}
      WX_REMINDER_TEMPLATE_ID: ${WX_REMINDER_TEMPLATE_ID:-SRj7mQ0c6juhTrXsl8VRWLpLJuwehMjZpWRNUlar1ts}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      PANDASCORE_API_TOKEN: ${PANDASCORE_API_TOKEN:-}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-gdelt}
      GDELT_BASE_URL: ${GDELT_BASE_URL:-https://api.gdeltproject.org/api/v2/doc/doc}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-30}
      NEWS_MAX_ARTICLES: ${NEWS_MAX_ARTICLES:-1000}
      SPORTS_SYNC_INTERVAL_MS: ${SPORTS_SYNC_INTERVAL_MS:-900000}
      NEWS_SYNC_INTERVAL_MS: ${NEWS_SYNC_INTERVAL_MS:-3600000}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_TYPE: ${AI_API_TYPE:-chat_completions}
      AI_BASE_URL: ${AI_BASE_URL:-https://chatapi.weixin.qq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-Deepseek-v4-flash}
      AI_WEB_SEARCH_ENABLED: ${AI_WEB_SEARCH_ENABLED:-true}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-55000}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-5}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
    volumes:
      - app-data:/data
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?请配置 DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
